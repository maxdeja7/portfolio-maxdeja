<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAXDEJA — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #F4EF9A;
      --black: #0D0D0D;
      --white: #FFFFFF;
      --gray: #444444;
      --gray-light: #666666;
      --shadow: 7px 7px 0px var(--black);
      --shadow-sm: 4px 4px 0px var(--black);
      --border: 2.5px solid var(--black);
      --accent-1: #6BCEFF;
      --accent-2: #FF6B6B;
      --accent-3: #A8FF78;
      --accent-4: #E056FD;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: var(--yellow);
      cursor: default;
      user-select: none;
    }

    /* ── BACKGROUND PATTERN ── */
    #bg-pattern {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='%23F4EF9A'/%3E%3Ccircle cx='20' cy='20' r='2' fill='black' fill-opacity='0.1'/%3E%3C/svg%3E");
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    /* ── HEADER ── */
    #header {
      position: fixed;
      top: 24px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      pointer-events: none;
    }

    .header-btn {
      font-family: 'Archivo Black', sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--black);
      background: var(--yellow);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 8px 14px;
      pointer-events: all;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .header-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--black);
    }
    .header-btn:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    /* ── CANVAS ── */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }
    #canvas.dragging { cursor: grabbing; }

    #world {
      position: absolute;
      width: 3000px;
      height: 3000px;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }

    /* ── CARDS ── */
    .project-card {
      position: absolute;
      width: 300px;
      background: var(--white);
      border: 3px solid var(--black);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      will-change: transform;
    }
    .project-card:hover {
      transform: rotate(var(--rot)) translate(3px, 3px) !important;
      box-shadow: 4px 4px 0px var(--black);
    }
    .project-card:active {
      transform: rotate(var(--rot)) translate(7px, 7px) !important;
      box-shadow: none;
    }

    .card-accent {
      height: 8px;
      border-bottom: 3px solid var(--black);
      flex-shrink: 0;
    }

    .card-img-wrap {
      width: 100%;
      height: 180px;
      overflow: hidden;
      border-bottom: 3px solid var(--black);
      background: #e8e8e8;
      flex-shrink: 0;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 24px;
      color: var(--black);
      line-height: 1.1;
    }
    .card-excerpt {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--gray);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 6px;
    }
    .card-client {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--gray-light);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .card-cta {
      font-family: 'Archivo Black', sans-serif;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--yellow);
      background: var(--black);
      border: 2px solid var(--black);
      padding: 6px 12px;
    }

    /* ── HINT ── */
    #hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: var(--black);
      border: var(--border);
      box-shadow: 5px 5px 0px rgba(244,239,154,0.4);
      padding: 11px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 1;
      transition: opacity 1s ease;
      pointer-events: none;
    }
    #hint.hidden { opacity: 0; }
    .hint-dot {
      width: 16px;
      height: 16px;
      border: 2px solid var(--yellow);
      border-radius: 50%;
      flex-shrink: 0;
    }
    #hint span {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--yellow);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ── ZOOM TRANSITION ── */
    #zoom-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      overflow: hidden;
    }
    #zoom-img {
      position: absolute;
      object-fit: cover;
      transform-origin: top left;
      transition: none;
    }

    /* ── LOADING / ERROR ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--yellow);
      font-family: 'Archivo Black', sans-serif;
      font-size: 20px;
      color: var(--black);
    }

    /* ════════════════════════════════
       MOBILE
    ════════════════════════════════ */
    @media (max-width: 768px) {
      html, body { overflow: auto; }

      #bg-pattern { display: none; }
      body { background: var(--yellow); }

      #canvas { position: static; height: auto; cursor: default; }
      #world {
        position: static;
        width: 100%;
        height: auto;
        transform: none !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 90px 20px 40px;
      }

      .project-card {
        position: static !important;
        transform: none !important;
        width: 100%;
        max-width: 400px;
        box-shadow: 5px 5px 0px var(--black);
      }
      .project-card:hover {
        transform: translate(2px, 2px) !important;
        box-shadow: 3px 3px 0px var(--black);
      }

      #header {
        top: 0;
        background: var(--yellow);
        border-bottom: var(--border);
        padding: 12px 16px;
      }
      .header-logo-mobile {
        font-family: 'Archivo Black', sans-serif;
        font-size: 14px;
        letter-spacing: 0.06em;
        color: var(--black);
      }
      .header-btn.desktop-only { display: none; }

      /* Burger */
      #burger {
        display: flex;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        pointer-events: all;
        padding: 4px;
      }
      #burger span {
        display: block;
        width: 22px;
        height: 2px;
        background: var(--black);
      }

      #mobile-menu {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--yellow);
        z-index: 500;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        border-top: var(--border);
      }
      #mobile-menu.open { display: flex; }
      #mobile-menu a, #mobile-menu button {
        font-family: 'Archivo Black', sans-serif;
        font-size: 24px;
        color: var(--black);
        text-decoration: none;
        background: none;
        border: none;
        cursor: pointer;
        letter-spacing: 0.04em;
      }
      #menu-close {
        position: absolute;
        top: 16px;
        right: 16px;
        font-size: 28px !important;
      }

      #hint { display: none; }
    }

    @media (min-width: 769px) {
      .header-logo-mobile { display: none; }
      #burger { display: none; }
      #mobile-menu { display: none !important; }
    }
  </style>
</head>
<body>

<div id="bg-pattern"></div>
<div id="loader">Chargement…</div>

<!-- HEADER -->
<header id="header">
  <!-- Mobile -->
  <span class="header-logo-mobile">MAXDEJA</span>
  <div id="burger" role="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </div>

  <!-- Desktop -->
  <a href="#" class="header-btn desktop-only">MAXDEJA — PORTFOLIO</a>
  <a href="#" class="header-btn desktop-only" id="about-btn">À propos / Contactez-moi</a>
</header>

<!-- Mobile menu -->
<div id="mobile-menu">
  <button id="menu-close">✕</button>
  <a href="#">Projets</a>
  <a href="#" id="about-mobile">À propos / Contactez-moi</a>
</div>

<!-- CANVAS -->
<div id="canvas">
  <div id="world"></div>
</div>

<!-- HINT -->
<div id="hint">
  <div class="hint-dot"></div>
  <span>Déplacez-vous dans le plan en maintenant le clic</span>
</div>

<!-- ZOOM OVERLAY -->
<div id="zoom-overlay">
  <img id="zoom-img" src="" alt="" />
</div>

<script>
  const PROXY = 'https://notion-proxy-brown.vercel.app/api/notion';
  const DATABASE_ID = '3d67b12f4b1880a1a4baee47680c227d';

  const ACCENTS = ['#6BCEFF', '#FF6B6B', '#A8FF78', '#E056FD', '#FFB347', '#FF85C2'];

  // ── NOTION ──
  function getProp(props, name, type) {
    const p = props[name];
    if (!p) return null;
    if (type === 'title') return p.title?.map(t => t.plain_text).join('') || null;
    if (type === 'rich_text') return p.rich_text?.map(t => t.plain_text).join('') || null;
    if (type === 'url') return p.url || null;
    return null;
  }

  async function fetchProjects() {
    const res = await fetch(`${PROXY}?path=databases/${DATABASE_ID}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page_size: 20 })
    });
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    return data.results;
  }

  // ── LAYOUT — répartition quasi-aléatoire sans grille rigide ──
  function layoutCards(count) {
    const W = 3000, H = 3000;
    const cx = W / 2, cy = H / 2;
    const CARD_W = 300, CARD_H = 400, MARGIN = 60;

    // Grille souple : on place en cercles concentriques légèrement perturbés
    const positions = [];
    const cols = Math.ceil(Math.sqrt(count));
    const rows = Math.ceil(count / cols);
    const cellW = Math.min(500, (W * 0.7) / cols);
    const cellH = Math.min(520, (H * 0.65) / rows);
    const startX = cx - (cols * cellW) / 2;
    const startY = cy - (rows * cellH) / 2;

    for (let i = 0; i < count; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const jitterX = (Math.random() - 0.5) * cellW * 0.35;
      const jitterY = (Math.random() - 0.5) * cellH * 0.35;
      positions.push({
        x: startX + col * cellW + jitterX,
        y: startY + row * cellH + jitterY,
        rot: (Math.random() - 0.5) * 8
      });
    }
    return positions;
  }

  // ── RENDER CARDS ──
  function buildCards(pages) {
    const world = document.getElementById('world');
    world.innerHTML = '';

    const isMobile = window.innerWidth <= 768;
    const positions = isMobile ? [] : layoutCards(pages.length);

    pages.forEach((page, i) => {
      const props = page.properties;
      const titre = getProp(props, 'Titre', 'title') || getProp(props, 'Name', 'title') || 'Sans titre';
      const client = getProp(props, 'Client', 'rich_text') || '';
      const solution = getProp(props, 'Solution', 'rich_text') || '';
      const couverture = getProp(props, 'Couverture', 'url') || '';
      const accent = ACCENTS[i % ACCENTS.length];

      const card = document.createElement('div');
      card.className = 'project-card';

      if (!isMobile) {
        const pos = positions[i];
        const rot = pos.rot;
        card.style.setProperty('--rot', `${rot}deg`);
        card.style.left = pos.x + 'px';
        card.style.top = pos.y + 'px';
        card.style.transform = `rotate(${rot}deg)`;
      }

      card.innerHTML = `
        <div class="card-accent" style="background:${accent}"></div>
        <div class="card-img-wrap">
          ${couverture ? `<img src="${couverture}" alt="${titre}" loading="lazy" data-src="${couverture}" />` : ''}
        </div>
        <div class="card-body">
          <div class="card-title">${titre}</div>
          ${solution ? `<div class="card-excerpt">${solution}</div>` : ''}
          <div class="card-footer">
            <span class="card-client">${client}</span>
            <span class="card-cta">VOIR →</span>
          </div>
        </div>
      `;

      card.addEventListener('click', (e) => {
        e.stopPropagation();
        if (wasDragging) return;
        const img = couverture;
        const target = `projet.html?id=${page.id}`;
        zoomTransition(card, img, target);
      });

      world.appendChild(card);
    });

    // Centre le canvas sur le monde
    if (!isMobile) centerCanvas();
  }

  // ── CANVAS PAN ──
  let panX = 0, panY = 0;
  let startX, startY, startPanX, startPanY;
  let isPanning = false;
  let wasDragging = false;

  function centerCanvas() {
    const vw = window.innerWidth, vh = window.innerHeight;
    panX = (vw - 3000) / 2;
    panY = (vh - 3000) / 2;
    applyPan();
  }

  function applyPan() {
    document.getElementById('world').style.transform = `translate(${panX}px, ${panY}px)`;
  }

  const canvas = document.getElementById('canvas');

  canvas.addEventListener('mousedown', (e) => {
    if (window.innerWidth <= 768) return;
    isPanning = true;
    wasDragging = false;
    startX = e.clientX;
    startY = e.clientY;
    startPanX = panX;
    startPanY = panY;
    canvas.classList.add('dragging');
  });

  window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) wasDragging = true;
    panX = startPanX + dx;
    panY = startPanY + dy;
    applyPan();
  });

  window.addEventListener('mouseup', () => {
    isPanning = false;
    canvas.classList.remove('dragging');
    setTimeout(() => { wasDragging = false; }, 50);
  });

  // Touch pan
  let touchStartX, touchStartY, touchStartPanX, touchStartPanY, touchMoved;
  canvas.addEventListener('touchstart', (e) => {
    if (window.innerWidth <= 768) return;
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    touchStartPanX = panX; touchStartPanY = panY;
    touchMoved = false;
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (window.innerWidth <= 768) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) touchMoved = true;
    panX = touchStartPanX + dx;
    panY = touchStartPanY + dy;
    applyPan();
  }, { passive: true });

  canvas.addEventListener('touchend', () => {
    wasDragging = touchMoved;
    setTimeout(() => { wasDragging = false; }, 50);
  });

  // ── ZOOM TRANSITION ──
  function zoomTransition(card, imgSrc, target) {
    if (!imgSrc) { window.location.href = target; return; }

    const overlay = document.getElementById('zoom-overlay');
    const zoomImg = document.getElementById('zoom-img');

    // Position de l'image dans la card
    const imgWrap = card.querySelector('.card-img-wrap');
    const rect = imgWrap.getBoundingClientRect();

    zoomImg.src = imgSrc;
    zoomImg.style.cssText = `
      position: absolute;
      left: ${rect.left}px;
      top: ${rect.top}px;
      width: ${rect.width}px;
      height: ${rect.height}px;
      object-fit: cover;
      transform-origin: top left;
      transition: none;
    `;
    overlay.style.pointerEvents = 'all';

    // Force reflow
    zoomImg.getBoundingClientRect();

    // Anime vers plein écran
    const vw = window.innerWidth, vh = window.innerHeight;
    zoomImg.style.transition = 'left 0.5s cubic-bezier(0.4,0,0.2,1), top 0.5s cubic-bezier(0.4,0,0.2,1), width 0.5s cubic-bezier(0.4,0,0.2,1), height 0.5s cubic-bezier(0.4,0,0.2,1)';
    zoomImg.style.left = '0px';
    zoomImg.style.top = '0px';
    zoomImg.style.width = vw + 'px';
    zoomImg.style.height = vh + 'px';

    setTimeout(() => {
      // Précharge la page projet dans un iframe caché puis navigue
      window.location.href = target + '&zoom=1&img=' + encodeURIComponent(imgSrc);
    }, 500);
  }

  // ── HINT ──
  let hintHidden = false;
  canvas.addEventListener('mousedown', () => {
    if (!hintHidden) {
      hintHidden = true;
      document.getElementById('hint').classList.add('hidden');
    }
  });

  // ── BURGER MOBILE ──
  document.getElementById('burger').addEventListener('click', () => {
    document.getElementById('mobile-menu').classList.add('open');
  });
  document.getElementById('menu-close').addEventListener('click', () => {
    document.getElementById('mobile-menu').classList.remove('open');
  });

  // ── INIT ──
  async function init() {
    try {
      const pages = await fetchProjects();
      buildCards(pages);
      document.getElementById('loader').style.display = 'none';
    } catch (err) {
      document.getElementById('loader').textContent = 'Erreur de chargement. Vérifie la connexion Notion.';
    }
  }

  window.addEventListener('resize', () => {
    if (window.innerWidth > 768) centerCanvas();
  });

  init();
</script>
</body>
</html>
