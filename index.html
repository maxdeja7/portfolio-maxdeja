  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono&display=swap" rel="stylesheet" />
  <style>
    * { cursor: none !important; }
    /* Empêche le navigateur de lancer son propre glisser-déposer
       sur les liens et les images, qui avalait les clics rapides. */
    a, img, svg, button { -webkit-user-drag: none; user-drag: none; }

    :root {
      --yellow: #F4EF9A;
      --black: #0D0D0D;
      --white: #FFFFFF;
      --gray: #444444;
      --gray-light: #666666;
      --shadow: 7px 7px 0px var(--black);
      --shadow-sm: 4px 4px 0px var(--black);
      --border: 2.5px solid var(--black);
      --accents: #6BCEFF, #FF6B6B, #A8FF78, #E056FD, #FFB347, #FF85C2;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: var(--yellow);
      user-select: none;
      cursor: none;
    }

    /* ── BACKGROUND ── */
    #bg {
      position: fixed; inset: -40px; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='40' height='40' fill='%23F4EF9A'/%3E%3Ccircle cx='20' cy='20' r='2' fill='black' fill-opacity='0.1'/%3E%3C/svg%3E");
      background-size: 40px 40px;
      will-change: transform;
    }

    /* ── HEADER ── */
    #header {
      position: fixed; top: 24px; left: 0; right: 0;
      z-index: 100; display: flex;
      justify-content: space-between; align-items: center;
      padding: 0 24px; pointer-events: none;
    }
    .hbtn {
      font-family: 'Archivo Black', sans-serif;
      font-size: 13px; letter-spacing: 0.04em;
      color: var(--black); background: var(--yellow);
      border: var(--border); box-shadow: var(--shadow-sm);
      padding: 8px 14px; pointer-events: all;
      cursor: pointer; text-decoration: none;
      display: inline-block;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .hbtn:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--black); }
    .hbtn:active { transform: translate(4px,4px); box-shadow: none; }
    .hbtn.desktop-only, .hbtn.mobile-only { background: var(--white); }
    .mobile-only { display: none; }
    .hbtn-logo {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 9px 16px; line-height: 1;
      overflow: visible;
      background: var(--white);
    }
    .hbtn-logo img {
      height: 20px; width: auto; display: block;
      object-fit: contain; flex-shrink: 0;
    }

    /* ── CANVAS ── */
    #canvas {
      position: fixed; inset: 0; z-index: 1;
      cursor: grab;
    }
    #canvas.dragging { cursor: grabbing; }
    #world {
      position: absolute;
      width: 3000px; height: 3000px;
      top: 0; left: 0;
      transform-origin: 0 0;
    }

    /* ── CARDS ── */
    .project-card {
      position: absolute; width: 300px;
      background: var(--white);
      border: 3px solid var(--black);
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      cursor: pointer;
      transition: box-shadow 0.15s ease;
      will-change: transform;
    }
    .project-card:hover {
      box-shadow: 4px 4px 0 var(--black);
      transform: rotate(var(--rot)) translate(3px,3px) !important;
    }
    .project-card:active {
      box-shadow: none;
      transform: rotate(var(--rot)) translate(7px,7px) !important;
    }
    .card-accent { height: 8px; border-bottom: 3px solid var(--black); flex-shrink: 0; }
    .card-img-wrap {
      width: 100%; height: 180px; overflow: hidden;
      border-bottom: 3px solid var(--black);
      background: #e8e8e8; flex-shrink: 0;
    }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
    .card-title { font-family: 'Archivo Black', sans-serif; font-size: 24px; color: var(--black); line-height: 1.1; }
    .card-excerpt {
      font-size: 12px; color: var(--gray); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 6px; }
    .card-client { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--gray-light); letter-spacing: 0.12em; text-transform: uppercase; }
    .card-cta { font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.04em; color: var(--yellow); background: var(--black); border: 2px solid var(--black); padding: 6px 12px; }

    /* ── PANNEAU MENTIONS LÉGALES ── */
    #sign {
      position: fixed;
      bottom: -30px; left: 40px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: bottom center;
      cursor: pointer;
      will-change: transform;
      text-decoration: none;
      filter: drop-shadow(7px 7px 0 var(--black));
    }
    #sign-board {
      background: #FF693B;
      border: 3px solid var(--black);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: -3px;
      position: relative;
      z-index: 2;
    }
    #sign-board p {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      line-height: 19.5px;
      letter-spacing: 0.52px;
      color: var(--black);
      white-space: nowrap;
      margin: 0;
    }
    #sign-board p:first-child { font-weight: 500; }
    #sign-post {
      background: #FF693B;
      border: 3px solid var(--black);
      border-bottom: none;
      width: 18.5px;
      height: 110px;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 1024px), (max-width: 1366px) and (hover: none) and (pointer: coarse) {
      #sign {
        left: 50%; bottom: -34px;
        transform: translate(-50%, 190%) rotate(3.44deg);
        transition: transform .55s cubic-bezier(.34,1.22,.64,1);
        filter: drop-shadow(5px 5px 0 var(--black));
        pointer-events: none;
      }
      #sign.visible { transform: translate(-50%, 0) rotate(3.44deg); pointer-events: all; }
      #sign-board { padding: 12px 16px; }
      #sign-board p { font-size: 12px; line-height: 17px; }
      #sign-post { height: 80px; }
    }

    /* ── ZOOM IMAGE (transition sortante) ── */
    #zoom-clone {
      position: fixed; z-index: 150;
      object-fit: cover; pointer-events: none;
      transition: left 0.5s cubic-bezier(0.4,0,0.2,1),
                  top 0.5s cubic-bezier(0.4,0,0.2,1),
                  width 0.5s cubic-bezier(0.4,0,0.2,1),
                  height 0.5s cubic-bezier(0.4,0,0.2,1),
                  opacity 0.3s ease;
      display: none;
    }

    /* ── PANNEAU PROJET ── */
    #projet-panel {
      position: fixed; inset: 0; z-index: 200;
      display: none; flex-direction: column;
      overflow: hidden;
      background: var(--yellow);
    }

    /* Nav sticky */
    #panel-nav {
      position: relative; z-index: 10; flex-shrink: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px;
      background: var(--yellow);
    }
    .panel-logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 14px; letter-spacing: 0.4px;
      color: var(--black);
      background: none; border: none; box-shadow: none;
      padding: 0; text-decoration: none;
      max-width: 62vw;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #panel-close {
      font-family: 'Archivo Black', sans-serif;
      font-size: 13px; letter-spacing: 0.52px;
      color: var(--black);
      background: #fff;
      border: 2.5px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
      padding: 8px 16px;
      display: flex; align-items: center; gap: 4px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #panel-close:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--black); }
    #panel-close svg { width: 20px; height: 20px; }

    /* ── BOÎTE AUX LETTRES (détail projet) ── */
    #sign-contact {
      position: absolute;
      bottom: -34px; left: 50%;
      z-index: 20;
      width: 190px;
      transform: translate(-50%, 150%);
      transform-origin: bottom center;
      cursor: pointer;
      transition: transform .5s cubic-bezier(.34,1.25,.64,1);
      pointer-events: none;
      filter: drop-shadow(6px 6px 0 rgba(13,13,13,.25));
    }
    #sign-contact.visible {
      transform: translate(-50%, 0);
      pointer-events: all;
    }
    #sign-contact svg { display: block; width: 100%; height: auto; overflow: visible; }

    /* Drapeau : pivote au survol */
    #mb-flag {
      transform-origin: 258px 86px;
      transition: transform .45s cubic-bezier(.34,1.4,.64,1);
    }
    #sign-contact.hovered #mb-flag { transform: rotate(-32deg); }

    /* Enveloppe : cachée dans la boîte, sort au survol */
    #mb-letter {
      transform: translate(0px, 10px) rotate(0deg);
      transition: transform .55s cubic-bezier(.34,1.35,.64,1);
    }
    #sign-contact.hovered #mb-letter {
      transform: translate(-215px, -18px) rotate(-8deg);
    }

    /* Légère bascule de toute la boîte au survol */
    #mb-box { transition: transform .4s cubic-bezier(.34,1.3,.64,1); transform-origin: 200px 300px; }
    #sign-contact.hovered #mb-box { transform: rotate(-1.5deg); }

    /* Libellé sous la boîte */
    #mb-label {
      position: absolute;
      bottom: 100%; left: 50%;
      transform: translate(-50%, -6px);
      background: var(--black);
      color: var(--yellow);
      font-family: 'Archivo Black', sans-serif;
      font-size: 12px; letter-spacing: .5px;
      padding: 7px 14px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }
    #sign-contact.hovered #mb-label {
      opacity: 1;
      transform: translate(-50%, -12px);
    }

    /* Contenu scrollable */
    #panel-content {
      flex: 1; overflow-y: auto;
      background: var(--yellow);
      scroll-behavior: smooth;
      padding-bottom: 24px;
    }

    /* Bandeau */
    #panel-bandeau {
      width: 100%; flex-shrink: 0;
      background: #e0deda;
      position: relative; overflow: hidden;
      height: 42vh;
    }
    #panel-bandeau img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    #panel-body {
      padding: 24px;
      display: flex; flex-direction: column; gap: 24px;
    }

    /* Ligne titre + client */
    .p-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 24px; flex-wrap: wrap;
    }
    .p-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(23px, 6vw, 48px);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      -webkit-text-stroke: 4px var(--black);
      paint-order: stroke fill;
      filter: drop-shadow(0 4px 0 var(--black));
      line-height: 1.1;
      margin: 0;
    }
    .p-client {
      display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }
    .p-client-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: #6A6A6A;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .p-client-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      color: var(--black);
      white-space: nowrap;
    }

    /* Blocs texte */
    .p-block { display: flex; flex-direction: column; gap: 4px; }
    .p-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: #6A6A6A;
      text-transform: uppercase;
    }
    .p-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      color: var(--black);
      line-height: 1.5;
      margin: 0;
    }

    /* Grilles images */
    .p-trio, .p-duo {
      display: grid; gap: 24px;
    }
    .p-trio { grid-template-columns: repeat(3, 1fr); }
    .p-duo  { grid-template-columns: repeat(2, 1fr); }
    .p-cell {
      background: #d9d9d9;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    .p-cell img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    /* Footer navigation projets */
    .p-nav {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap;
      position: relative; z-index: 30;
    }
    .p-nav-btn {
      font-family: 'Archivo Black', sans-serif;
      font-size: 13px; letter-spacing: 0.52px;
      color: var(--black);
      background: #fff;
      border: 2.5px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
      padding: 8px 16px;
      display: flex; align-items: center; gap: 4px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .p-nav-btn:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--black); }
    .p-nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .p-nav-btn:disabled { opacity: 0.35; cursor: default; }
    .p-nav-btn:disabled:hover { transform: none; box-shadow: 4px 4px 0 var(--black); }

    @media (max-width: 1024px), (max-width: 1366px) and (hover: none) and (pointer: coarse) {
      .p-trio, .p-duo { grid-template-columns: 1fr; gap: 16px; }
      .p-head { flex-direction: column; align-items: flex-start; gap: 12px; }
      .p-title { -webkit-text-stroke-width: 3px; }
    }

    /* Fade-up du contenu */
    .panel-fade-up {
      opacity: 0;
      transform: translateY(28px);
    }
    .panel-fade-up-active {
      animation: fadeUp .5s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── POUBELLE ── */
    #trash {
      position: fixed;
      bottom: 32px; right: 36px;
      z-index: 90;
      width: 62px; height: 62px;
      color: var(--black);
      transition: transform 0.2s, color 0.2s;
    }
    #trash svg { width: 100%; height: 100%; display: block; fill: currentColor; }
    /* Pendant un glisser, la poubelle passe devant la carte (z-index 300) */
    #trash.front { z-index: 320; }
    #trash.over { color: #E24B4A; transform: scale(1.12) rotate(-4deg); animation: trashShake 0.25s ease infinite alternate; }
    @keyframes trashShake {
      0% { transform: scale(1.12) rotate(-5deg); }
      100% { transform: scale(1.12) rotate(5deg); }
    }
    #trash-label {
      position: fixed;
      bottom: 110px; right: 24px;
      font-family: 'DM Mono', monospace;
      font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-light);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #trash-label.visible { opacity: 1; }

    /* ── DRAG CARD ── */
    .project-card.dragged {
      position: fixed !important;
      z-index: 300;
      pointer-events: none;
      box-shadow: 12px 12px 0 var(--black);
      transform: rotate(4deg) scale(1.04) !important;
      transition: box-shadow 0.1s !important;
      opacity: 0.95;
    }
    .project-card.drag-ghost {
      opacity: 0.25;
      pointer-events: none;
    }

    /* ── CURSEUR FANTÔME ── */
    #ghost-cursor {
      position: fixed;
      z-index: 150;
      pointer-events: none;
      will-change: transform;
      display: none;
    }
    #ghost-cursor svg { display: block; }
    #ghost-label-tag {
      position: absolute;
      top: 18px; left: 8px;
      background: #2A52A0;
      color: #fff;
      font-family: 'Archivo Black', sans-serif;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 3px;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    #ghost-bubble {
      position: fixed;
      z-index: 151;
      pointer-events: none;
      background: var(--black);
      color: var(--yellow);
      font-family: 'DM Mono', monospace;
      font-size: 13px; font-weight: 500;
      padding: 6px 14px;
      border-radius: 4px;
      border: 2.5px solid var(--black);
      box-shadow: 3px 3px 0 var(--black);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s;
      display: none;
    }
    #ghost-bubble.visible { opacity: 1; }
    #ghost-bubble::after {
      content: '|';
      animation: blink 0.55s step-end infinite;
    }
    #ghost-bubble.done::after { display: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── LOADER ── */
    #loader {
      position: fixed; inset: 0; z-index: 400;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: var(--yellow);
      opacity: 1; transition: opacity .4s ease;
    }
    #loader.gone { opacity: 0; pointer-events: none; }
    #spinner {
      width: 52px; height: 52px;
      border: 6px solid var(--black);
      border-top-color: #FF693B;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-text {
      font-family: 'DM Mono', monospace;
      font-size: 12px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--gray-light);
    }
    @media (prefers-reduced-motion: reduce) {
      #spinner { animation-duration: 2.4s; }
    }

    /* ════════ MOBILE ════════ */
    @media (max-width: 1024px), (max-width: 1366px) and (hover: none) and (pointer: coarse) {
      html, body {
        height: auto; min-height: 100%;
        overflow-x: hidden; overflow-y: visible;
        margin: 0; width: 100%;
      }
      /* Curseur natif rendu : pas de pointeur à remplacer au doigt */
      * { cursor: auto !important; }
      a, button { cursor: pointer !important; }
      #user-cursor, #ghost-cursor, #ghost-bubble,
      #trash, #trash-label { display: none !important; }

      #bg { display: none; }

      /* Plus aucune mécanique de plan : simple liste verticale */
      #canvas { position: static; height: auto; cursor: default; }
      #world {
        position: static; box-sizing: border-box;
        width: 100%; height: auto;
        transform: none !important;
        display: flex; flex-direction: column;
        align-items: center; gap: 20px;
        padding: 88px 24px 200px;
      }
      .project-card {
        position: static !important; transform: none !important;
        width: 100%; max-width: 460px;
        box-shadow: 5px 5px 0 var(--black);
      }
      .project-card:hover { transform: translate(2px,2px) !important; box-shadow: 3px 3px 0 var(--black); }
      .card-title { font-size: 21px; }

      /* Header compact */
      #header {
        top: 0; background: var(--yellow);
        border-bottom: var(--border);
        padding: 12px 24px; gap: 12px;
      }
      .hbtn.desktop-only { display: none !important; }
      .mobile-only { display: inline-block; }
      .hbtn-logo { padding: 7px 12px; gap: 8px; font-size: 12px; }
      .hbtn-logo img { height: 17px; }
      .hbtn.mobile-only { padding: 7px 12px; font-size: 12px; }

      #hint { display: none; }

      /* Panneau projet */
      #panel-nav { padding: 12px 24px; }
      .panel-logo { font-size: 12px; max-width: 58vw; }
      #panel-close { padding: 7px 12px; font-size: 12px; }
      #panel-close svg { width: 16px; height: 16px; }
      #panel-bandeau { height: 46vw; min-height: 170px; }

<script>
const PROXY = 'https://notion-proxy-brown.vercel.app/api/notion';
const DATABASE_ID = '3d67b12f4b1880a1a4baee47680c227d';
const ACCENTS = ['#6BCEFF','#FF6B6B','#A8FF78','#E056FD','#FFB347','#FF85C2'];

// ── UTILS ──
function getProp(props, name, type) {
  const p = props[name];
  if (!p) return null;
  if (type === 'title') return p.title?.map(t => t.plain_text).join('') || null;
  if (type === 'rich_text') return p.rich_text?.map(t => t.plain_text).join('') || null;
  if (type === 'url') return p.url || null;
  if (type === 'date') return p.date?.start || null;
  if (type === 'select') return p.select?.name || null;
  return null;
}
function imgCell(src, alt) {
  if (!src) return `<div class="img-cell"></div>`;
  return `<div class="img-cell"><img src="${src}" alt="${alt}" loading="lazy"/></div>`;
}
function fmtDate(str) {
  if (!str) return null;
  return new Date(str).toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
}

// ── FETCH ──
async function fetchProjects() {
  const res = await fetch(`${PROXY}?path=databases/${DATABASE_ID}/query`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ page_size: 20 })
  });
  if (!res.ok) throw new Error(res.status);
  return (await res.json()).results;
}

async function fetchPage(id) {
  const res = await fetch(`${PROXY}?path=pages/${id}`);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

// ── LAYOUT CARDS ──
function layoutCards(count) {
  const cx = 1500, cy = 1500;
  const cols = Math.ceil(Math.sqrt(count));
  const rows = Math.ceil(count / cols);
  const cellW = Math.min(480, 1800 / cols);
  const cellH = Math.min(500, 1600 / rows);
  const startX = cx - (cols * cellW) / 2;
  const startY = cy - (rows * cellH) / 2;
  return Array.from({ length: count }, (_, i) => ({
    x: startX + (i % cols) * cellW + (Math.random() - 0.5) * cellW * 0.3,
    y: startY + Math.floor(i / cols) * cellH + (Math.random() - 0.5) * cellH * 0.3,
    rot: (Math.random() - 0.5) * 8
  }));
}

// ── BUILD CARDS ──
let pages = [];
function buildCards(data) {
  pages = data;
  const world = document.getElementById('world');
  world.innerHTML = '';
  const isMobile = window.matchMedia('(max-width: 1024px), (max-width: 1366px) and (hover: none) and (pointer: coarse)').matches;
  const positions = isMobile ? [] : layoutCards(data.length);

  data.forEach((page, i) => {
    const props = page.properties;
    const titre = getProp(props,'Titre','title') || getProp(props,'Name','title') || 'Sans titre';
    const client = getProp(props,'Client','rich_text') || '';
    const solution = getProp(props,'Solution','rich_text') || '';
    const couverture = getProp(props,'Couverture','url') || '';
    const anecdote = getProp(props,'Anecdote','rich_text') || '';
    const accent = ACCENTS[i % ACCENTS.length];

    const card = document.createElement('div');
    card.className = 'project-card';
    card.dataset.id = page.id;
    card.dataset.img = couverture;
    card.dataset.anecdote = anecdote;

    if (!isMobile) {
      const { x, y, rot } = positions[i];
      card.style.cssText = `left:${x}px;top:${y}px;transform:rotate(${rot}deg);--rot:${rot}deg`;
    }

    card.innerHTML = `
      <div class="card-accent" style="background:${accent}"></div>
      <div class="card-img-wrap">
        ${couverture ? `<img src="${couverture}" alt="${titre}" loading="lazy"/>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${titre}</div>
        ${solution ? `<div class="card-excerpt">${solution}</div>` : ''}
        <div class="card-footer">
          <span class="card-client">${client}</span>
          <span class="card-cta">VOIR →</span>
        </div>
      </div>`;

    world.appendChild(card);
  });

  if (!isMobile) centerCanvas();
}

// ── CANVAS PAN ──
let panX = 0, panY = 0, isPanning = false, wasDragging = false;
let isDraggingCard = false;
let sx, sy, spx, spy;

function centerCanvas() {
  panX = (window.innerWidth - 3000) / 2;
  panY = (window.innerHeight - 3000) / 2;
  applyPan();
}
const worldEl = document.getElementById('world');
const bgEl    = document.getElementById('bg');
const TILE    = 40;   // taille du motif de fond

function applyPan() {
  worldEl.style.transform = `translate(${panX}px,${panY}px)`;
  // Le motif suit le plan au pixel près. Le modulo le ramène
  // dans une seule tuile : le fond déborde de 40px, rien ne se découvre.
  bgEl.style.transform = `translate(${panX % TILE}px,${panY % TILE}px)`;
}

const canvas = document.getElementById('canvas');

canvas.addEventListener('mousedown', e => {
  if (window.matchMedia('(max-width: 1024px), (max-width: 1366px) and (hover: none) and (pointer: coarse)').matches) return;
  if (isDraggingCard) return;
  if (e.target.closest('.project-card')) return;
  isPanning = true; wasDragging = false;
  sx = e.clientX; sy = e.clientY; spx = panX; spy = panY;
  canvas.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) wasDragging = true;
  panX = spx + dx; panY = spy + dy; applyPan();
  if (typeof signReactToPan === 'function') signReactToPan();
});
window.addEventListener('mouseup', () => {
  isPanning = false; canvas.classList.remove('dragging');
  setTimeout(() => { wasDragging = false; }, 50);
});

// Touch
let tx0, ty0, tpx, tpy, tmoved;
canvas.addEventListener('touchstart', e => {
  if (window.matchMedia('(max-width: 1024px), (max-width: 1366px) and (hover: none) and (pointer: coarse)').matches) return;
  const t = e.touches[0];
  tx0 = t.clientX; ty0 = t.clientY; tpx = panX; tpy = panY; tmoved = false;
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (window.matchMedia('(max-width: 1024px), (max-width: 1366px) and (hover: none) and (pointer: coarse)').matches) return;
  const t = e.touches[0];
  const dx = t.clientX - tx0, dy = t.clientY - ty0;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) tmoved = true;
  panX = tpx + dx; panY = tpy + dy; applyPan();
}, { passive: true });
canvas.addEventListener('touchend', () => {
  wasDragging = tmoved;
  setTimeout(() => { wasDragging = false; }, 50);
});

// ── OPEN PROJECT (SPA) ──
async function openProject(id, imgSrc, cardEl) {
  const vw = window.innerWidth, vh = window.innerHeight;

  // ── ÉTAPE 0 : header apparaît immédiatement ──
  const panel = document.getElementById('projet-panel');
  const panelNav = document.getElementById('panel-nav');
  panel.style.display = 'flex';
  panel.style.opacity = '1';
  panel.style.pointerEvents = 'all';
  panelNav.style.opacity = '1';
  // Suspend le curseur fantôme pendant la consultation du détail
  ghostSuspend();
  document.getElementById('panel-bandeau').style.opacity = '0';
  document.getElementById('panel-content').style.overflow = 'hidden';

  const navH = panelNav.offsetHeight;
  const BANDEAU_H = Math.round(vh * 0.42);

  // ── PHASE 1 : l'image de la card zoome vers le plein écran (hors header) ──
  const hero = document.getElementById('zoom-clone');
  const imgWrap = cardEl.querySelector('.card-img-wrap');
  const r = imgWrap.getBoundingClientRect();

  if (imgSrc) {
    hero.src = imgSrc;
    hero.style.cssText = `
      display:block; position:fixed; z-index:250; object-fit:cover;
      left:${r.left}px; top:${r.top}px;
      width:${r.width}px; height:${r.height}px;
      transition:none;
    `;
    hero.getBoundingClientRect();

    // → Zone sous le header
    hero.style.transition = 'left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1), width .5s cubic-bezier(.4,0,.2,1), height .5s cubic-bezier(.4,0,.2,1)';
    hero.style.left = '0';
    hero.style.top = navH + 'px';
    hero.style.width = vw + 'px';
    hero.style.height = (vh - navH) + 'px';
  }

  // Fetch en parallèle
  let page;
  try { page = await fetchPage(id); } catch(e) { hero.style.display='none'; panel.style.display='none'; return; }

  renderPanelBody(page, id, imgSrc, true);
  history.pushState({ projetId: id }, document.title, `?projet=${id.replace(/-/g,'')}`);

  const bandeauImg = document.getElementById('panel-bandeau-img');

  // ── PHASE 2 : l'image se rogne vers la hauteur du bandeau ──
  setTimeout(() => {
    hero.style.transition = 'height .55s cubic-bezier(.4,0,.2,1)';
    hero.style.height = BANDEAU_H + 'px';

    // ── PHASE 3 : swap hero → bandeau réel, fade-up contenu ──
    setTimeout(() => {
      bandeauImg.style.opacity = '1';
      document.getElementById('panel-bandeau').style.opacity = '1';
      document.getElementById('panel-content').style.overflow = '';
      hero.style.display = 'none';
      document.querySelectorAll('.panel-fade-up').forEach(el => el.classList.add('panel-fade-up-active'));
    }, 560);

  }, 480);
}

// ── RENDU DU CONTENU DU PANNEAU (partagé) ──
function renderPanelBody(page, id, fallbackImg, animated) {
  const props = page.properties;

  const titre    = getProp(props,'Titre','title') || getProp(props,'Name','title') || 'Sans titre';
  const client   = getProp(props,'Client','rich_text');
  const contexte = getProp(props,'Contexte','rich_text');
  const solution = getProp(props,'Solution','rich_text');
  const couverture = getProp(props,'Couverture','url') || fallbackImg || '';
  const logoClient = getProp(props,'LogoClient','url') || '';
  const trio1    = getProp(props,'Trio1','url');
  const trio2    = getProp(props,'Trio2','url');
  const trio3    = getProp(props,'Trio3','url');
  const duo1     = getProp(props,'Duo1','url');
  const duo2     = getProp(props,'Duo2','url');

  document.title = `${titre} — MAXDEJA`;
  document.getElementById('panel-title').textContent = titre;

  const bandeauImg = document.getElementById('panel-bandeau-img');
  if (animated) bandeauImg.style.opacity = '0';
  else bandeauImg.style.opacity = '1';
  bandeauImg.src = couverture;

  // Navigation projet précédent / suivant
  const idx = pages.findIndex(p => p.id === id);
  const prev = idx > 0 ? pages[idx - 1] : null;
  const next = idx >= 0 && idx < pages.length - 1 ? pages[idx + 1] : null;

  const arrowLeft  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`;
  const arrowRight = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;

  const cell = src => `<div class="p-cell">${src ? `<img src="${src}" alt="" loading="lazy"/>` : ''}</div>`;
  const fade = animated ? 'panel-fade-up' : '';

  document.getElementById('panel-body').innerHTML = `
    <div class="p-head ${fade}">
      <h1 class="p-title">${titre}</h1>
      ${client ? `
      <div class="p-client">
        <span class="p-client-label">Client :</span>
        <span class="p-client-name">${client}</span>
      </div>` : ''}
    </div>

    ${contexte ? `
    <div class="p-block ${fade}" style="animation-delay:.08s">
      <span class="p-label">Contexte</span>
      <p class="p-text">${contexte}</p>
    </div>` : ''}

    ${(trio1||trio2||trio3) ? `
    <div class="p-trio ${fade}" style="animation-delay:.14s">
      ${cell(trio1)}${cell(trio2)}${cell(trio3)}
    </div>` : ''}

    ${solution ? `
    <div class="p-block ${fade}" style="animation-delay:.18s">
      <span class="p-label">Solution</span>
      <p class="p-text">${solution}</p>
    </div>` : ''}

    ${(duo1||duo2) ? `
    <div class="p-duo ${fade}" style="animation-delay:.22s">
      ${cell(duo1)}${cell(duo2)}
    </div>` : ''}

    <div class="p-nav ${fade}" style="animation-delay:.26s">
      <button class="p-nav-btn" id="p-prev" ${prev ? '' : 'disabled'}>
        ${arrowLeft} Projet précédent
      </button>
      <button class="p-nav-btn" id="p-next" ${next ? '' : 'disabled'}>
        Projet suivant ${arrowRight}
      </button>
    </div>
  `;

  document.getElementById('panel-content').scrollTop = 0;
  // Article court : pas de défilement, on évalue tout de suite
  requestAnimationFrame(() => { if (typeof checkSignContact === 'function') checkSignContact(); });
  const sc = document.getElementById('sign-contact');
  if (sc) sc.classList.remove('visible');

  if (prev) document.getElementById('p-prev').addEventListener('click', () => switchProject(prev.id));
  if (next) document.getElementById('p-next').addEventListener('click', () => switchProject(next.id));
}

// Change de projet sans fermer le panneau
async function switchProject(newId) {
  const content = document.getElementById('panel-content');
  content.style.transition = 'opacity .2s';
  content.style.opacity = '0';
  setTimeout(async () => {
    try {
      const page = await fetchPage(newId);
      renderPanelBody(page, newId, '', false);
      history.pushState({ projetId: newId }, document.title, `?projet=${newId.replace(/-/g,'')}`);
      content.style.opacity = '1';
    } catch(e) {
      content.style.opacity = '1';
    }
  }, 200);
}

// ── CLOSE PROJECT ──
function closeProject() {
  const panel = document.getElementById('projet-panel');
  document.getElementById('sign-contact')?.classList.remove('visible');
  panel.style.opacity = '0';
  panel.style.transition = 'opacity .25s ease';
  document.title = 'MAXDEJA : Portfolio UI/UX de Maxence Dejaegher';
  history.pushState({}, 'Portfolio', window.location.pathname);
  setTimeout(() => {
    panel.style.display = 'none';
    panel.style.opacity = '';
    panel.style.transition = '';
    document.getElementById('panel-body').innerHTML = '';
    document.getElementById('panel-bandeau-img').src = '';
    document.getElementById('panel-bandeau-img').style.opacity = '';
    document.getElementById('panel-content').style.opacity = '';
    document.getElementById('panel-content').style.transition = '';
    ghostResume();
  }, 280);
}

document.getElementById('panel-close').addEventListener('click', closeProject);

// ── PANNEAU CONTACT : apparaît en bas de page ──
const signContact = document.getElementById('sign-contact');
const panelContentEl = document.getElementById('panel-content');

function checkSignContact() {
  const el = panelContentEl;

  signContact.classList.toggle('visible', atBottom);
}

panelContentEl.addEventListener('scroll', checkSignContact);

// Survol de la boîte aux lettres : l'enveloppe sort, le drapeau se lève
if (window.matchMedia('(max-width: 1024px), (max-width: 1366px) and (hover: none) and (pointer: coarse)').matches) {
  // Tactile : pas de survol possible, la boîte est ouverte d'office
  signContact.classList.add('hovered');
} else {
  signContact.addEventListener('mouseenter', () => signContact.classList.add('hovered'));
  signContact.addEventListener('mouseleave', () => signContact.classList.remove('hovered'));
}

// Retour navigateur
window.addEventListener('popstate', e => {
  if (!e.state?.projetId) closeProject();
});

// Lien direct vers un projet via URL
async function openFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const rawId = params.get('projet');
  if (!rawId) return;
  // Reformate l'UUID
  const id = rawId.replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/, '$1-$2-$3-$4-$5');
  const match = pages.find(p => p.id === id);
  const imgSrc = match ? getProp(match.properties,'Couverture','url') || '' : '';
  // Ouvre sans animation zoom
  await openProjectDirect(id, imgSrc);
}

async function openProjectDirect(id, imgSrc) {
  let page;
  try { page = await fetchPage(id); } catch(e) { return; }

  renderPanelBody(page, id, imgSrc, false);

  const panel2 = document.getElementById('projet-panel');
  panel2.style.display = 'flex';
  panel2.style.opacity = '1';
  panel2.style.pointerEvents = 'all';
  document.getElementById('panel-bandeau').style.opacity = '1';
  document.getElementById('panel-content').style.overflow = '';
  if (typeof ghostSuspend === 'function') ghostSuspend();
}

// ════════════════════════════════════════
// PANNEAU : OSCILLATION AU VENT + RÉACTION AU PAN
// ════════════════════════════════════════
const signEl = document.getElementById('sign');
const SIGN_BASE = 3.44;        // inclinaison de repos (deg)
let signWind = 0;
let signPush = 0;              // impulsion du pan
let signPushVel = 0;
let lastSignPanX = 0;

const MOBILE_MQ = '(max-width: 1024px), (max-width: 1366px) and (hover: none) and (pointer: coarse)';
const isMobile = () => window.matchMedia(MOBILE_MQ).matches;
let signCleared = false;

function signLoop(now) {
  if (isMobile()) {
    // On rend la main au CSS : la transform inline écraserait la classe .visible
    if (!signCleared) { signEl.style.transform = ''; signCleared = true; }
    requestAnimationFrame(signLoop);
    return;
  }
  signCleared = false;

  // Vent : deux sinusoïdes de périodes différentes → mouvement irrégulier naturel
  const t = now / 1000;
  signWind = Math.sin(t * 0.7) * 0.8 + Math.sin(t * 1.9 + 1.3) * 0.35;

  // Ressort amorti pour le retour élastique après un pan
  signPushVel += (0 - signPush) * 0.12;
  signPushVel *= 0.82;
  signPush    += signPushVel;

  signEl.style.transform = `rotate(${SIGN_BASE + signWind + signPush}deg)`;
  requestAnimationFrame(signLoop);
}
requestAnimationFrame(signLoop);

// Sur mobile, le panneau sort du bas quand on atteint la fin de la page
function checkSignMobile() {
  if (!isMobile()) { signEl.classList.remove('visible'); return; }
  const atBottom = scrollY + innerHeight >= document.documentElement.scrollHeight - 10;
  signEl.classList.toggle('visible', atBottom);
}
addEventListener('scroll', checkSignMobile, { passive: true });
addEventListener('resize', checkSignMobile);
checkSignMobile();

// Le panneau se penche à l'inverse du mouvement du plan
function signReactToPan() {
  const delta = panX - lastSignPanX;
  lastSignPanX = panX;
  const impulse = Math.max(-9, Math.min(9, -delta * 0.22));
  signPush += impulse * 0.35;
}

// ════════════════════════════════════════
// GLISSER NATIF DÉSACTIVÉ
// ════════════════════════════════════════
// Firefox ignore -webkit-user-drag : on coupe l'évènement à la source,
// sinon un clic un peu glissé sur un lien lance un drag et avale le clic.
document.addEventListener('dragstart', e => e.preventDefault());

// ════════════════════════════════════════
// CURSEUR CUSTOM UTILISATEUR (orange)
// ════════════════════════════════════════
const userCursorEl = document.createElement('div');
userCursorEl.id = 'user-cursor';
userCursorEl.innerHTML = `<svg width="27" height="27" viewBox="0 0 20 20" fill="none">
  <path d="M4 2L16 10L10 11.5L7.5 17L4 2Z" fill="#FF784E" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
</svg>`;
userCursorEl.style.cssText = 'position:fixed;z-index:500;pointer-events:none;transform:translate(-100px,-100px);';
document.body.appendChild(userCursorEl);
document.body.style.cursor = 'none';
document.querySelectorAll('a,button,.hbtn,.project-card').forEach(el => el.style.cursor = 'none');
window.addEventListener('mousemove', e => {
  userCursorEl.style.transform = `translate(${e.clientX}px,${e.clientY}px)`;
});

// ════════════════════════════════════════
// DRAG & DROP CARDS + POUBELLE
// ════════════════════════════════════════
const trash = document.getElementById('trash');
const trashLabel = document.getElementById('trash-label');

let dragCard = null;       // clone visuel qui suit la souris
let dragGhost = null;      // card originale (fantôme)
let dragOffX = 0, dragOffY = 0;
let dragOrigPos = null;

function getTrashRect() { return trash.getBoundingClientRect(); }
function isOverTrash(x, y) {
  const r = getTrashRect();
  return x > r.left - 30 && x < r.right + 30 && y > r.top - 30 && y < r.bottom + 30;
}

// Délégation : UN SEUL listener sur le world, valable pour toutes les cards
// présentes et futures — impossible de le perdre.
function enableCardDrag(card) {
  // Ne fait plus rien : la délégation gère tout.
  // Conservé pour compatibilité avec les appels existants.
  if (card) card.classList.remove('drag-ghost');
}

document.getElementById('world').addEventListener('mousedown', onCardMouseDown);

// État "en attente" : on ne sait pas encore si c'est un clic ou un drag
let pendingDrag = null;
let pendingTimer = null;
const DRAG_THRESHOLD = 5;   // px de mouvement pour déclencher le drag
const DRAG_HOLD_MS   = 180; // ms de maintien pour déclencher le drag

function onCardMouseDown(e) {
  if (e.button !== 0) return;
  if (isMobile()) return;          // mobile : simple tap, pas de glisser
  if (document.getElementById('projet-panel').style.display === 'flex') return;

  const card = e.target.closest('.project-card');
  if (!card) return;

  const rect = card.getBoundingClientRect();

  // On mémorise tout, mais on ne démarre PAS le drag tout de suite
  pendingDrag = {
    card,
    rect,
    startX: e.clientX,
    startY: e.clientY,
    offX: e.clientX - rect.left,
    offY: e.clientY - rect.top
  };

  // Maintien long → drag
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => {
    if (pendingDrag) startRealDrag(pendingDrag.startX, pendingDrag.startY);
  }, DRAG_HOLD_MS);

  e.stopPropagation();
  e.preventDefault();
}

function startRealDrag(clientX, clientY) {
  if (!pendingDrag || dragCard) return;
  const { card, rect, offX, offY } = pendingDrag;

  clearTimeout(pendingTimer);

  dragOffX = offX;
  dragOffY = offY;
  dragOrigPos = {
    worldLeft: card.style.left,
    worldTop:  card.style.top,
    rot:       card.style.getPropertyValue('--rot') || '0deg'
  };

  dragGhost = card;
  dragCard = card.cloneNode(true);
  dragCard.classList.add('dragged');
  dragCard.classList.remove('drag-ghost');
  dragCard.style.cssText += `position:fixed;left:${clientX - offX}px;top:${clientY - offY}px;width:${rect.width}px;z-index:300;transform:rotate(4deg) scale(1.04);pointer-events:none;box-shadow:12px 12px 0 #0D0D0D;opacity:0.95;`;
  document.body.appendChild(dragCard);

  dragGhost.classList.add('drag-ghost');
  trashLabel.classList.add('visible');
  trash.classList.add('front');   // la poubelle passe devant la carte

  isDraggingCard = true;
  wasDragging = true;
  pendingDrag = null;
}

window.addEventListener('mousemove', e => {
  // Seuil de mouvement → déclenche le drag
  if (pendingDrag && !dragCard) {
    const dx = e.clientX - pendingDrag.startX;
    const dy = e.clientY - pendingDrag.startY;
    if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
      startRealDrag(e.clientX, e.clientY);
    }
    return;
  }

  if (!dragCard) return;
  dragCard.style.left = (e.clientX - dragOffX) + 'px';
  dragCard.style.top  = (e.clientY - dragOffY) + 'px';
  if (isOverTrash(e.clientX, e.clientY)) trash.classList.add('over');
  else trash.classList.remove('over');
});

window.addEventListener('mouseup', e => {
  clearTimeout(pendingTimer);

  // Relâché avant le seuil → c'était un CLIC SIMPLE → ouvre le projet
  if (pendingDrag && !dragCard) {
    const card = pendingDrag.card;
    pendingDrag = null;
    const id  = card.dataset.id;
    const img = card.dataset.img || '';
    if (id) openProject(id, img, card);
    return;
  }

  if (!dragCard) return;

  trash.classList.remove('over');
  trashLabel.classList.remove('visible');

  if (isOverTrash(e.clientX, e.clientY)) {
    dropInTrash();   // 'front' est retiré à la fin de l'animation de chute
  } else {
    trash.classList.remove('front');
    const newWorldX = e.clientX - dragOffX - panX;
    const newWorldY = e.clientY - dragOffY - panY;
    dragGhost.style.left = newWorldX + 'px';
    dragGhost.style.top  = newWorldY + 'px';
    dragOrigPos.worldLeft = newWorldX + 'px';
    dragOrigPos.worldTop  = newWorldY + 'px';
    dragCard.remove();
    dragGhost.classList.remove('drag-ghost');
    dragCard = null;
    dragGhost = null;
    isDraggingCard = false;
    setTimeout(() => { wasDragging = false; }, 50);
  }
});

function dropInTrash() {
  if (!dragCard || !dragGhost) return;

  const trashR = getTrashRect();
  dragCard.style.transition = 'left 0.3s ease, top 0.3s ease, opacity 0.3s ease, transform 0.3s ease';
  dragCard.style.left = (trashR.left + trashR.width/2 - 150) + 'px';
  dragCard.style.top  = (trashR.top - 20) + 'px';
  dragCard.style.opacity   = '0';
  dragCard.style.transform = 'rotate(10deg) scale(0.4)';

  const ghostRef = dragGhost;
  const origPos  = { ...dragOrigPos };
  const cardClone = dragCard;

  dragCard = null;
  dragGhost = null;
  isDraggingCard = false;

  setTimeout(() => {
    cardClone.remove();
    trash.classList.remove('front');
    // CRITIQUE : retire drag-ghost (qui porte pointer-events:none)
    ghostRef.classList.remove('drag-ghost');
    ghostRef.style.opacity    = '0';
    ghostRef.style.transition = 'opacity 0.15s';
    ghostRef.style.display    = '';
    setTimeout(() => {
      ghostRef.style.display = 'none';
      ghostGrumble(ghostRef, origPos);
    }, 160);
  }, 320);

  setTimeout(() => { wasDragging = false; }, 50);
}

// ════════════════════════════════════════
// CURSEUR FANTÔME
// ════════════════════════════════════════
const ghostEl     = document.getElementById('ghost-cursor');
const ghostBubble = document.getElementById('ghost-bubble');
let gx = window.innerWidth * 0.15, gy = window.innerHeight * 0.5;
let ghostRafId = null;
let ghostBusy  = false;
let ghostPaused = false;
let wanderTimeout = null;
let hoverTimer = null;
let hoverTyping = false;

function setGhost(x, y) {
  gx = x; gy = y;
  ghostEl.style.transform = `translate(${x}px, ${y}px)`;
  // Bulle : s'affiche à gauche si proche du bord droit
  const bubW = 260;
  const bx = (x + 28 + bubW > window.innerWidth - 10) ? x - bubW - 8 : x + 28;
  ghostBubble.style.left = bx + 'px';
  ghostBubble.style.top  = (y - 10) + 'px';
}

function ghostAnimTo(x0, y0, x1, y1, dur, easeFn, cb) {
  cancelAnimationFrame(ghostRafId);
  const t0 = performance.now();
  const tick = now => {
    let t = Math.min((now - t0) / dur, 1);
    t = easeFn(t);
    setGhost(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
    if (t < 1) ghostRafId = requestAnimationFrame(tick);
    else if (cb) cb();
  };
  ghostRafId = requestAnimationFrame(tick);
}

const gEaseOut   = t => 1 - Math.pow(1 - t, 3);
const gEaseInOut = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;

function ghostShowBubble(msg, cb) {
  ghostBubble.textContent = '';
  ghostBubble.classList.remove('done');
  ghostBubble.style.display = 'block';
  ghostBubble.classList.add('visible');
  let i = 0;
  const next = () => {
    if (i < msg.length) {
      ghostBubble.textContent = msg.slice(0, ++i);
      // micro-jitter pendant la frappe
      setGhost(gx + (Math.random()-.5)*4, gy + (Math.random()-.5)*3);
      setTimeout(next, 40 + Math.random() * 33);
    } else {
      ghostBubble.classList.add('done');
      if (cb) setTimeout(cb, 1400);
    }
  };
  next();
}

function ghostHideBubble(cb) {
  ghostBubble.classList.remove('visible');
  setTimeout(() => {
    ghostBubble.style.display = 'none';
    ghostBubble.textContent   = '';
    ghostBubble.classList.remove('done');
    if (cb) cb();
  }, 200);
}

function ghostCircles(cb) {
  const cx = gx, cy = gy, rx = 30, ry = 18;
  const rounds = 3.5, dur = 600;
  const t0 = performance.now();
  const tick = now => {
    const t = (now - t0) / dur;
    if (t >= rounds) { setGhost(cx, cy); if (cb) cb(); return; }
    setGhost(cx + Math.cos(t * Math.PI * 2) * rx, cy + Math.sin(t * Math.PI * 2) * ry);
    ghostRafId = requestAnimationFrame(tick);
  };
  ghostRafId = requestAnimationFrame(tick);
}

function ghostWander() {
  if (ghostBusy || ghostPaused) return;
  clearTimeout(wanderTimeout);
  const w = window.innerWidth, h = window.innerHeight;
  const p = { x: 80 + Math.random() * (w - 200), y: 80 + Math.random() * (h - 160) };
  const dist = Math.hypot(p.x - gx, p.y - gy);
  ghostAnimTo(gx, gy, p.x, p.y, 500 + dist * 1.2, gEaseInOut, () => {
    wanderTimeout = setTimeout(ghostWander, 80 + Math.random() * 600);
  });
}

// Suspend / reprend le fantôme (pendant la consultation d'un projet)
function ghostSuspend() {
  ghostPaused = true;
  clearTimeout(wanderTimeout);
  clearTimeout(hoverTimer);
  cancelAnimationFrame(ghostRafId);
  ghostEl.style.display = 'none';
  ghostBubble.style.display = 'none';
  ghostBubble.classList.remove('visible', 'done');
  ghostBubble.textContent = '';
}

function ghostResume() {
  if (!ghostPaused) return;
  ghostPaused = false;
  ghostEl.style.display = 'block';
  setTimeout(ghostWander, 400);
}

// Séquence accueil
function ghostWelcome() {
  ghostEl.style.display = 'block';
  ghostBubble.style.display = 'none';
  setGhost(window.innerWidth * 0.15, window.innerHeight * 0.5);
  ghostAnimTo(gx, gy, window.innerWidth * 0.35, window.innerHeight * 0.45, 900, gEaseOut, () => {
    ghostShowBubble('Bienvenue ! Déplacez-vous dans le plan en maintenant le clic =)', () => {
      ghostCircles(() => {
        ghostHideBubble(() => ghostWander());
      });
    });
  });
}

// Séquence récupération card depuis la poubelle
function ghostGrumble(cardEl, origPos) {
  ghostBusy = true;
  clearTimeout(wanderTimeout);
  cancelAnimationFrame(ghostRafId);
  ghostEl.style.display = 'block';
  ghostBubble.style.display = 'none';

  const trashR  = getTrashRect();
  const targetX = trashR.left - 40;
  const targetY = trashR.top  - 20;

  ghostAnimTo(gx, gy, targetX, targetY, 700, gEaseOut, () => {
    ghostShowBubble('Eh ! On ne jette pas les projets clients !', () => {
      ghostHideBubble(() => {
        // Ressort la card de la poubelle : scale 0 → 1 avec rebond
        // Nettoyage complet de l'état laissé par le drag
        cardEl.classList.remove('drag-ghost', 'dragged');
        cardEl.style.display      = '';
        cardEl.style.opacity      = '1';
        cardEl.style.pointerEvents = '';
        cardEl.style.transition   = 'none';
        cardEl.style.transform    = `rotate(${origPos.rot}) scale(0)`;

        // Double RAF pour forcer le navigateur à peindre scale(0) avant d'animer
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            cardEl.style.transition = 'transform 0.55s cubic-bezier(0.34,1.56,0.64,1)';
            cardEl.style.transform  = `rotate(${origPos.rot}) scale(1)`;
          });
        });

        // Le curseur va "chercher" la card et l'accompagne à sa place
        const cardScreenX = parseFloat(origPos.worldLeft) + panX + 150;
        const cardScreenY = parseFloat(origPos.worldTop)  + panY + 100;

        ghostAnimTo(gx, gy, cardScreenX, cardScreenY, 700, gEaseOut, () => {
          setTimeout(() => {
            cardEl.style.transition = '';
            cardEl.style.transform  = `rotate(${origPos.rot}) scale(1)`;
            cardEl.classList.remove('drag-ghost', 'dragged');
            cardEl.style.pointerEvents = '';
            ghostBusy = false;
            setTimeout(ghostWander, 300);
          }, 560);
        });
      });
    });
  });
}

// ── ANECDOTE AU SURVOL ──

function onCardHover(anecdote) {
  if (!anecdote || ghostBusy || ghostPaused) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => {
    if (ghostBusy || ghostPaused) return;
    hoverTyping = true;
    // Pause : le ghost finit son pas en cours (on annule le wander suivant)
    clearTimeout(wanderTimeout);
    cancelAnimationFrame(ghostRafId);
    // Tape l'anecdote sans bouger
    ghostShowBubble(anecdote, () => {
      hoverTyping = false;
      // Affiche 2.5s puis reprend la promenade
      setTimeout(() => {
        ghostHideBubble(() => ghostWander());
      }, 2500);
    });
  }, 500);
}

function onCardLeave() {
  clearTimeout(hoverTimer);
}

// Active le drag + hover anecdote sur les cards après buildCards
const _origBuildCards = buildCards;
function buildCardsWithDrag(data) {
  _origBuildCards(data);
  const mob = isMobile();

  document.querySelectorAll('.project-card').forEach(card => {
    if (mob) {
      // Liste simple : un tap ouvre le projet, rien d'autre
      card.addEventListener('click', () => {
        openProject(card.dataset.id, card.dataset.img || '', card);
      });
      return;
    }
    enableCardDrag(card);
    const anecdote = card.dataset.anecdote || '';
    if (anecdote) {
      card.addEventListener('mouseenter', () => onCardHover(anecdote));
      card.addEventListener('mouseleave', onCardLeave);
    }
  });

  if (!mob) setTimeout(ghostWelcome, 800);
  checkSignMobile();
}

// ── BURGER MOBILE ──

// ── INIT ──
const LOADER_T0 = performance.now();
const LOADER_MIN = 500;    // évite le clignotement si Notion répond vite

function hideLoader() {
  const el = document.getElementById('loader');
  const wait = Math.max(0, LOADER_MIN - (performance.now() - LOADER_T0));
  setTimeout(() => {
    el.classList.add('gone');
    setTimeout(() => { el.style.display = 'none'; }, 460);
  }, wait);
}

async function init() {
  try {
    const data = await fetchProjects();
    buildCardsWithDrag(data);
    hideLoader();
    await openFromUrl();
  } catch(err) {
    document.getElementById('loader-text').textContent = 'Erreur de chargement Notion.';
  }
}

window.addEventListener('resize', () => { if (!isMobile()) centerCanvas(); });
init();
