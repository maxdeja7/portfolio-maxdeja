<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F6F3;
      --ink: #1A1A18;
      --ink-soft: #6B6B67;
      --accent: #2A52A0;
      --card-bg: #ffffff;
      --radius: 4px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    header {
      padding: 3rem 5vw 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(26,26,24,0.1);
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: -0.02em;
    }

    nav a {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--ink-soft);
      text-decoration: none;
      margin-left: 2rem;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--ink); }

    .hero {
      padding: 5rem 5vw 3rem;
    }
    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      max-width: 14ch;
      margin-bottom: 1.5rem;
    }
    .hero p {
      font-size: 1rem;
      color: var(--ink-soft);
      font-weight: 300;
      max-width: 42ch;
      line-height: 1.7;
    }

    .grid-label {
      padding: 0 5vw;
      margin-bottom: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1px;
      background: rgba(26,26,24,0.1);
      border-top: 1px solid rgba(26,26,24,0.1);
    }

    .project-card {
      background: var(--card-bg);
      text-decoration: none;
      color: inherit;
      display: block;
      overflow: hidden;
      transition: background 0.2s;
    }
    .project-card:hover { background: #f0efeb; }
    .project-card:hover .card-img img { transform: scale(1.03); }

    .card-img {
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #e8e7e3;
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .card-img .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-soft);
      font-size: 0.8rem;
    }

    .card-body {
      padding: 1.5rem 1.75rem 2rem;
    }
    .card-meta {
      font-size: 0.75rem;
      color: var(--ink-soft);
      margin-bottom: 0.5rem;
    }
    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }
    .card-excerpt {
      font-size: 0.875rem;
      color: var(--ink-soft);
      font-weight: 300;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-arrow {
      display: inline-block;
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
    }

    .loading, .error {
      padding: 5rem 5vw;
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    footer {
      padding: 3rem 5vw;
      font-size: 0.8rem;
      color: var(--ink-soft);
      border-top: 1px solid rgba(26,26,24,0.1);
      margin-top: 4rem;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Votre Nom</div>
  <nav>
    <a href="index.html">Projets</a>
    <a href="mailto:votre@email.com">Contact</a>
  </nav>
</header>

<section class="hero">
  <h1>Designer UI/UX</h1>
  <p>Études de cas, interfaces et expériences pensées pour les usages réels.</p>
</section>

<p class="grid-label">Projets sélectionnés</p>

<div id="projects-container">
  <div class="loading">Chargement des projets…</div>
</div>

<footer>
  &copy; 2026 — Votre Nom
</footer>

<script>
  const NOTION_TOKEN = 'REMPLACE_PAR_TON_TOKEN_SECRET';
  const DATABASE_ID = '3d67b12f4b1880a1a4baee47680c227d';
  const PROXY = 'https://notion-proxy.vercel.app/api/notion';

  async function fetchProjects() {
    try {
      const res = await fetch(`https://api.notion.com/v1/databases/${DATABASE_ID}/query`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${NOTION_TOKEN}`,
          'Notion-Version': '2022-06-28',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ page_size: 20 })
      });

      if (!res.ok) throw new Error(`Erreur API: ${res.status}`);
      const data = await res.json();
      renderProjects(data.results);
    } catch (err) {
      document.getElementById('projects-container').innerHTML =
        `<div class="error">Impossible de charger les projets. Vérifie ton token Notion.<br><small>${err.message}</small></div>`;
    }
  }

  function getProp(props, name, type) {
    const p = props[name];
    if (!p) return null;
    if (type === 'title') return p.title?.map(t => t.plain_text).join('') || null;
    if (type === 'rich_text') return p.rich_text?.map(t => t.plain_text).join('') || null;
    if (type === 'url') return p.url || null;
    if (type === 'files') {
      const f = p.files?.[0];
      if (!f) return null;
      return f.type === 'external' ? f.external.url : f.file?.url || null;
    }
    return null;
  }

  function renderProjects(pages) {
    if (!pages.length) {
      document.getElementById('projects-container').innerHTML =
        '<div class="loading">Aucun projet trouvé dans la base Notion.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'projects-grid';

    pages.forEach(page => {
      const props = page.properties;
      const titre = getProp(props, 'Titre', 'title') || getProp(props, 'Name', 'title') || 'Sans titre';
      const client = getProp(props, 'Client', 'rich_text') || '';
      const contexte = getProp(props, 'Contexte', 'rich_text') || '';
      const couverture = getProp(props, 'Couverture', 'url') || getProp(props, 'Couverture', 'files');
      const pageId = page.id.replace(/-/g, '');

      const card = document.createElement('a');
      card.className = 'project-card';
      card.href = `projet.html?id=${page.id}`;

      card.innerHTML = `
        <div class="card-img">
          ${couverture
            ? `<img src="${couverture}" alt="${titre}" loading="lazy" />`
            : `<div class="placeholder">Aucune image</div>`
          }
        </div>
        <div class="card-body">
          ${client ? `<p class="card-meta">${client}</p>` : ''}
          <h2 class="card-title">${titre}</h2>
          ${contexte ? `<p class="card-excerpt">${contexte}</p>` : ''}
          <span class="card-arrow">Voir le projet →</span>
        </div>
      `;

      grid.appendChild(card);
    });

    document.getElementById('projects-container').innerHTML = '';
    document.getElementById('projects-container').appendChild(grid);
  }

  fetchProjects();
</script>

</body>
</html>
