<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projet — MAXDEJA Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #F4EF9A;
      --black: #0D0D0D;
      --white: #FFFFFF;
      --gray: #444444;
      --gray-light: #666666;
      --border: 2.5px solid var(--black);
      --shadow-sm: 4px 4px 0px var(--black);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #F7F6F3;
      color: var(--black);
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--yellow);
      border-bottom: var(--border);
    }
    .logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 13px;
      letter-spacing: 0.05em;
      color: var(--black);
      text-decoration: none;
    }
    .back-btn {
      font-family: 'Archivo Black', sans-serif;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--black);
      background: var(--yellow);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 6px 12px;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.1s;
      display: inline-block;
    }
    .back-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--black);
    }

    /* ── ZOOM ENTRY ── */
    #zoom-entry {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      overflow: hidden;
      background: transparent;
    }
    #zoom-entry-img {
      position: absolute;
      object-fit: cover;
      transform-origin: top left;
    }

    /* ── S1 BANDEAU ── */
    .s1-bandeau {
      width: 100%;
      aspect-ratio: 21/7;
      overflow: hidden;
      background: #e0deda;
      border-bottom: var(--border);
    }
    .s1-bandeau img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── TITRE ── */
    .projet-titre {
      padding: 3rem 5vw 0;
      background: #F7F6F3;
    }
    .projet-titre h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--black);
    }

    /* ── S2 CONTEXTE + INFOS ── */
    .s2-meta {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 4rem;
      padding: 3rem 5vw;
      border-bottom: 1px solid rgba(13,13,13,0.12);
      background: #F7F6F3;
    }
    @media (max-width: 720px) {
      .s2-meta { grid-template-columns: 1fr; gap: 2rem; }
    }

    .s2-contexte h2 {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--gray-light);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .s2-contexte p {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.75;
      color: var(--black);
      max-width: 60ch;
    }

    .s2-infos { padding-top: 0.25rem; }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(13,13,13,0.1);
      font-size: 0.875rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-light);
    }
    .info-val { font-weight: 500; color: var(--black); }

    /* ── S3 TRIO ── */
    .s3-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      background: var(--black);
    }
    .s3-trio .img-cell {
      aspect-ratio: 4/3;
      overflow: hidden;
      background: #e0deda;
    }
    .s3-trio .img-cell img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .s3-trio .img-cell:hover img { transform: scale(1.04); }
    @media (max-width: 600px) { .s3-trio { grid-template-columns: 1fr; } }

    /* ── S4 SOLUTION ── */
    .s4-solution {
      padding: 4rem 5vw;
      border-bottom: 1px solid rgba(13,13,13,0.12);
      background: var(--yellow);
    }
    .s4-solution h2 {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--gray-light);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .s4-solution p {
      font-size: 1.15rem;
      font-weight: 300;
      line-height: 1.8;
      max-width: 80ch;
      color: var(--black);
    }

    /* ── S5 DUO ── */
    .s5-duo {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      background: var(--black);
    }
    .s5-duo .img-cell {
      aspect-ratio: 3/2;
      overflow: hidden;
      background: #e0deda;
    }
    .s5-duo .img-cell img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .s5-duo .img-cell:hover img { transform: scale(1.04); }
    @media (max-width: 600px) { .s5-duo { grid-template-columns: 1fr; } }

    /* ── FOOTER ── */
    .projet-footer {
      padding: 3rem 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: var(--border);
      background: #F7F6F3;
    }
    .projet-footer a {
      font-family: 'Archivo Black', sans-serif;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--black);
      background: var(--yellow);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 8px 14px;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .projet-footer a:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--black);
    }

    .state {
      padding: 6rem 5vw;
      font-family: 'Archivo Black', sans-serif;
      font-size: 1rem;
      color: var(--gray-light);
    }
  </style>
</head>
<body>

<!-- Zoom entry overlay -->
<div id="zoom-entry">
  <img id="zoom-entry-img" src="" alt="" style="display:none" />
</div>

<header>
  <a href="index.html" class="logo">MAXDEJA — PORTFOLIO</a>
  <a href="index.html" class="back-btn">← Retour</a>
</header>

<div id="content">
  <div class="state">Chargement…</div>
</div>

<script>
  const PROXY = 'https://notion-proxy-brown.vercel.app/api/notion';

  // Paramètres URL
  const params = new URLSearchParams(window.location.search);
  const pageId = params.get('id');
  const fromZoom = params.get('zoom') === '1';
  const zoomImgSrc = params.get('img');

  function getProp(props, name, type) {
    const p = props[name];
    if (!p) return null;
    if (type === 'title') return p.title?.map(t => t.plain_text).join('') || null;
    if (type === 'rich_text') return p.rich_text?.map(t => t.plain_text).join('') || null;
    if (type === 'url') return p.url || null;
    if (type === 'date') return p.date?.start || null;
    if (type === 'select') return p.select?.name || null;
    return null;
  }

  function imgCell(src, alt) {
    if (!src) return `<div class="img-cell"></div>`;
    return `<div class="img-cell"><img src="${src}" alt="${alt}" loading="lazy" /></div>`;
  }

  function formatDate(str) {
    if (!str) return null;
    return new Date(str).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  }

  // ── ZOOM ENTRY ANIMATION ──
  function playZoomEntry(bandeauEl) {
    if (!fromZoom || !zoomImgSrc) return;

    const overlay = document.getElementById('zoom-entry');
    const img = document.getElementById('zoom-entry-img');

    img.src = zoomImgSrc;
    img.style.cssText = `
      display: block;
      position: absolute;
      left: 0; top: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    `;

    // Attend que le bandeau soit rendu
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const rect = bandeauEl.getBoundingClientRect();
        img.style.transition = 'left 0.55s cubic-bezier(0.4,0,0.2,1), top 0.55s cubic-bezier(0.4,0,0.2,1), width 0.55s cubic-bezier(0.4,0,0.2,1), height 0.55s cubic-bezier(0.4,0,0.2,1)';
        img.style.left = rect.left + 'px';
        img.style.top = rect.top + 'px';
        img.style.width = rect.width + 'px';
        img.style.height = rect.height + 'px';

        setTimeout(() => {
          overlay.style.opacity = '0';
          overlay.style.transition = 'opacity 0.2s';
          setTimeout(() => { overlay.style.display = 'none'; }, 200);
        }, 580);
      });
    });
  }

  async function render() {
    if (!pageId) {
      document.getElementById('content').innerHTML = '<div class="state">Aucun projet spécifié.</div>';
      return;
    }

    try {
      const res = await fetch(`${PROXY}?path=pages/${pageId}`);
      if (!res.ok) throw new Error(`${res.status}`);
      const page = await res.json();
      const props = page.properties;

      const titre    = getProp(props, 'Titre', 'title') || getProp(props, 'Name', 'title') || 'Sans titre';
      const client   = getProp(props, 'Client', 'rich_text');
      const contexte = getProp(props, 'Contexte', 'rich_text');
      const solution = getProp(props, 'Solution', 'rich_text');
      const couverture = getProp(props, 'Couverture', 'url');
      const trio1    = getProp(props, 'Trio1', 'url');
      const trio2    = getProp(props, 'Trio2', 'url');
      const trio3    = getProp(props, 'Trio3', 'url');
      const duo1     = getProp(props, 'Duo1', 'url');
      const duo2     = getProp(props, 'Duo2', 'url');
      const date     = getProp(props, 'Date', 'date');
      const role     = getProp(props, 'Rôle', 'select') || getProp(props, 'Role', 'select');

      document.title = `${titre} — MAXDEJA Portfolio`;

      const infoRows = [
        client ? `<div class="info-row"><span class="info-label">Client</span><span class="info-val">${client}</span></div>` : '',
        date   ? `<div class="info-row"><span class="info-label">Date</span><span class="info-val">${formatDate(date)}</span></div>` : '',
        role   ? `<div class="info-row"><span class="info-label">Rôle</span><span class="info-val">${role}</span></div>` : '',
      ].join('');

      document.getElementById('content').innerHTML = `
        <!-- S1 Bandeau -->
        ${couverture ? `
        <div class="s1-bandeau" id="bandeau">
          <img src="${couverture}" alt="${titre}" />
        </div>` : ''}

        <!-- Titre -->
        <div class="projet-titre">
          <h1>${titre}</h1>
        </div>

        <!-- S2 Contexte + Infos -->
        <div class="s2-meta">
          <div class="s2-contexte">
            <h2>Contexte</h2>
            ${contexte ? `<p>${contexte}</p>` : ''}
          </div>
          <div class="s2-infos">${infoRows}</div>
        </div>

        <!-- S3 Trio -->
        ${(trio1 || trio2 || trio3) ? `
        <div class="s3-trio">
          ${imgCell(trio1, 'Image 1')}
          ${imgCell(trio2, 'Image 2')}
          ${imgCell(trio3, 'Image 3')}
        </div>` : ''}

        <!-- S4 Solution -->
        ${solution ? `
        <div class="s4-solution">
          <h2>Solution</h2>
          <p>${solution}</p>
        </div>` : ''}

        <!-- S5 Duo -->
        ${(duo1 || duo2) ? `
        <div class="s5-duo">
          ${imgCell(duo1, 'Image A')}
          ${imgCell(duo2, 'Image B')}
        </div>` : ''}

        <!-- Footer -->
        <div class="projet-footer">
          <a href="index.html">← Retour aux projets</a>
        </div>
      `;

      // Zoom entry depuis la page d'accueil
      const bandeau = document.getElementById('bandeau');
      if (bandeau) playZoomEntry(bandeau);

    } catch (err) {
      document.getElementById('content').innerHTML =
        `<div class="state">Impossible de charger ce projet.<br><small>${err.message}</small></div>`;
    }
  }

  render();
</script>
</body>
</html>
